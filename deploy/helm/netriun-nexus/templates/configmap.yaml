apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "netriun-nexus.fullname" . }}
  labels:
    {{- include "netriun-nexus.labels" . | nindent 4 }}
data:
  HTTP_ADDR: ":8080"
  APP_ORIGIN: {{ required "config.appOrigin is required" .Values.config.appOrigin | quote }}
  COOKIE_SECURE: {{ .Values.config.cookieSecure | quote }}
  TRUSTED_PROXY_CIDRS: {{ .Values.config.trustedProxyCidrs | quote }}
  SMTP_HOST: {{ .Values.config.smtp.host | quote }}
  SMTP_PORT: {{ .Values.config.smtp.port | quote }}
  SMTP_FROM_ADDRESS: {{ .Values.config.smtp.fromAddress | quote }}
  SMTP_FROM_NAME: {{ .Values.config.smtp.fromName | quote }}
